plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.mod_group

base {
	archivesName = project.mod_id
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API (客户端事件、网络与生命周期)
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Jsoup 网页解析库 (用于 MC百科 HTML 解析，使用 include 打包进模组 Jar)
	implementation "org.jsoup:jsoup:${project.jsoup_version}"
	include "org.jsoup:jsoup:${project.jsoup_version}"

	// Gson (Minecraft 已内置 Gson，但开发与编译期显式引用)
	implementation "com.google.code.gson:gson:${project.gson_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand(
			"version": project.version,
			"minecraft_version": project.minecraft_version,
			"loader_version": project.loader_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
