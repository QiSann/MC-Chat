org.gradle.parallel=true

# 强制绑定本地 JDK 17 (Minecraft 1.20.1 运行规范)
org.gradle.java.home=D:/java/jdk-17

# Fabric 基础配置 (Minecraft 1.20.1)
minecraft_version=1.20.1
